name: Qt feasibility prototype

on:
  push:
    branches: [cpp-qt]
    paths: ["qt-prototype/**", "packaging/windows/package.py", ".github/workflows/qt-prototype.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git gnupg tar zstd
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-python
      - name: Build and test native Qt and libmpv
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          g++ --version
          pkg-config --modversion Qt6Widgets mpv
          ffmpeg -version
          cmake -S qt-prototype -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qt
          ctest --test-dir build-qt -V
      - name: Package binaries, notices and corresponding source
        run: |
          set -euo pipefail
          python qt-prototype/package-windows.py "$(cygpath -m "$MINGW_PREFIX")" build-qt/spoolcut-qt.exe dist-qt-windows
      - name: Exercise relocated binaries with system PATH
        shell: pwsh
        run: ./qt-prototype/tests/smoke-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolCut-Qt-Windows-x86_64
          path: |
            dist-qt-windows/*.zip
            dist-qt-windows/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolCut-Qt-Windows-sources
          path: |
            dist-qt-windows/*.tar.zst
            dist-qt-windows/*.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 25
    steps:
      - name: Install native toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates g++ cmake ninja-build pkg-config \
            qt6-base-dev qt6-wayland libmpv-dev ffmpeg libgl1-mesa-dri weston xvfb xauth
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and test with X11 and Mesa software OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SPOOLCUT_QT_REQUIRE_OPENGL: 1
        run: |
          g++ --version
          pkg-config --modversion Qt6Widgets mpv
          ffmpeg -version
          cmake -S qt-prototype -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qt
          xvfb-run -a ctest --test-dir build-qt -V
      - name: Verify automatic fallback without an OpenGL surface
        env:
          QT_QPA_PLATFORM: offscreen
          SPOOLCUT_QT_REQUIRE_FALLBACK: 1
        run: ctest --test-dir build-qt -V -R '^prototype-auto$'
      - name: Test headless Wayland with Mesa
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          QT_QPA_PLATFORM: wayland
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=spoolcut-qt-ci
          weston --backend=headless --renderer=gl --shell=kiosk-shell.so \
            --socket="$WAYLAND_DISPLAY" --width=1280 --height=900 --idle-time=0 --no-config \
            > weston-qt.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; cat weston-qt.log' EXIT
          for attempt in {1..50}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
            kill -0 "$compositor"
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          ctest --test-dir build-qt -V
      - name: Run ASan and UBSan
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S qt-prototype -B build-qt-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSPOOLCUT_SANITIZERS=ON
          cmake --build build-qt-asan
          ctest --test-dir build-qt-asan -V -R '^prototype-software$'

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build AppImage and gather corresponding source
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git g++ cmake ninja-build pkg-config python3 \
              qt6-base-dev qt6-wayland libmpv-dev ffmpeg squashfs-tools xz-utils zstd
            sed -e "s/^Types: deb$/Types: deb-src/" /etc/apt/sources.list.d/debian.sources \
              > /etc/apt/sources.list.d/debian-source.sources
            apt-get update
            git config --global --add safe.directory /src
            cmake -S qt-prototype -B build-qt-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build build-qt-package
            python3 qt-prototype/package-linux.py build-qt-package/spoolcut-qt dist-qt-linux
          '
      - name: Run relocated AppImage with Fedora 44 Wayland
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src fedora:44 bash -euxc '
            dnf install -y weston mesa-dri-drivers libglvnd-egl libglvnd-glx libglvnd-opengl \
              mesa-libgbm libdrm vulkan-loader libwayland-client libwayland-cursor libwayland-egl \
              dejavu-sans-fonts xkeyboard-config
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            export QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=spoolcut-fedora LIBGL_ALWAYS_SOFTWARE=1
            weston --backend=headless --renderer=gl --shell=kiosk-shell.so \
              --socket="$WAYLAND_DISPLAY" --width=1280 --height=900 --idle-time=0 --no-config \
              >/tmp/weston.log 2>&1 &
            compositor=$!
            trap "kill $compositor 2>/dev/null || true; cat /tmp/weston.log" EXIT
            for attempt in {1..70}; do
              if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
              kill -0 "$compositor"
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            bash qt-prototype/tests/smoke-appimage.sh dist-qt-linux/SpoolCut-Qt-Fedora-x86_64.AppImage
          '
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolCut-Qt-Fedora-x86_64
          path: |
            dist-qt-linux/*.AppImage
            dist-qt-linux/*.AppImage.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SpoolCut-Qt-Linux-sources
          path: |
            dist-qt-linux/*.tar.zst
            dist-qt-linux/*.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error

  compare:
    runs-on: ubuntu-24.04
    container: rust:1-trixie
    timeout-minutes: 20
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates g++ cmake ninja-build pkg-config \
            qt6-base-dev libgtk-4-dev libmpv-dev ffmpeg xvfb xauth xdotool python3-xlib dbus-x11
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build both release editors
        run: |
          git -c safe.directory="$PWD" worktree add --detach /tmp/spoolcut-gtk 39cb4eecef8914f187871aac2187f8f023d14e0d
          cargo build --manifest-path /tmp/spoolcut-gtk/Cargo.toml --locked --release --features desktop --bins
          cmake -S qt-prototype -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-qt
      - name: Compare CPU, memory, startup and scrubbing
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            /usr/bin/python3 qt-prototype/tests/compare-linux.py /tmp/spoolcut-gtk/target/release/spoolcut-desktop \
            build-qt/spoolcut-qt /tmp/spoolcut-gtk/target/release/spoolcut
