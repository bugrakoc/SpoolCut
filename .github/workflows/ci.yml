name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: rust:1-trixie
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and media dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libmpv-dev libegl1 libgl1-mesa-dri ffmpeg weston dbus-x11 locales
          rustup component add rustfmt clippy
          localedef -i tr_TR -f UTF-8 tr_TR.UTF-8
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features desktop -- -D warnings
      - name: Test stream-copy export
        run: cargo test --locked
      - name: Test the desktop editor on Wayland
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=spoolcut-ci GDK_BACKEND=wayland GSK_RENDERER=ngl
          export GTK_A11Y=none LIBGL_ALWAYS_SOFTWARE=1
          weston --backend=headless --renderer=pixman --shell=kiosk-shell.so \
            --socket="$WAYLAND_DISPLAY" --width=1280 --height=900 --idle-time=0 --no-config \
            > weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; cat weston.log' EXIT
          for attempt in {1..50}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
            kill -0 "$weston_pid"
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          LC_ALL=tr_TR.UTF-8 dbus-run-session -- cargo test --locked --features desktop --bin spoolcut-desktop -- --ignored

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zstd
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
      - name: Verify the native toolchain
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          test "$(command -v rustc)" = /ucrt64/bin/rustc
          rustc -vV
          gcc -v
          pkg-config --modversion gtk4 mpv
          ffmpeg -version
          ffprobe -version
      - name: Test stream-copy export
        run: |
          set -euo pipefail
          if [[ -d /c/Users/runneradmin/AppData/Local/Temp && "$(cygpath -m /tmp)" == D:* ]]; then
            export SPOOLCUT_TEST_OTHER_VOLUME="C:/Users/runneradmin/AppData/Local/Temp"
          fi
          cargo test --locked --features desktop
      - name: Test the desktop editor with software preview
        env:
          GSK_RENDERER: cairo
          SPOOLCUT_PREVIEW: software
          GTK_A11Y: none
        run: cargo test --locked --features desktop --bin spoolcut-desktop -- --ignored --nocapture
      - name: Exercise OpenGL selection and fallback
        env:
          GSK_RENDERER: cairo
          SPOOLCUT_PREVIEW: opengl
          GTK_A11Y: none
        run: cargo test --locked --features desktop --bin spoolcut-desktop -- --ignored --nocapture
      - name: Build the portable ZIP and corresponding source archive
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cargo build --locked --release --features desktop
          cargo test --locked --features desktop --bin spoolcut-desktop --no-run --message-format=json |
            python -c 'import json, sys; print(next(m["executable"] for m in map(json.loads, sys.stdin.readlines()) if m.get("executable") and m["profile"]["test"]))' > windows-desktop-test.txt
          python packaging/windows/package.py "$(cygpath -m "$MINGW_PREFIX")" dist-windows
      - name: Smoke test the relocated portable ZIP
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: packaging/windows/smoke-package.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: SpoolCut-Windows-x86_64
          path: |
            dist-windows/SpoolCut-Windows-x86_64.zip
            dist-windows/SpoolCut-Windows-x86_64.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: SpoolCut-Windows-sources
          path: |
            dist-windows/SpoolCut-Windows-sources.tar.zst
            dist-windows/SpoolCut-Windows-sources.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
